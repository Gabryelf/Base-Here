<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ascension Protocol</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0b0d10;
      color: #e6e6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #game-canvas {
      position: fixed; inset: 0; display: block;
      width: 100vw; height: 100vh; touch-action: none;
    }
    #ui-overlay { position: fixed; inset: 0; pointer-events: none; }
    #ui-overlay > * { pointer-events: auto; }

    .hud-top {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), rgba(0,0,0,0));
    }
    .btn {
      background: #1c2128; color: #e6e6e6;
      border: 1px solid #2d333b; border-radius: 6px;
      padding: 8px 12px; font-size: 14px; cursor: pointer;
    }
    .btn:hover  { background: #22272e; }
    .btn:active { background: #2d333b; }
    .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

    .resources {
      display: flex; gap: 12px; margin-left: auto;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid #2d333b; border-radius: 8px;
      padding: 6px 12px; font-size: 13px;
    }
    .resources .res { display: flex; align-items: center; gap: 4px; }
    .resources .dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    }

    .hud-bottom {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex; gap: 8px; justify-content: flex-end;
      align-items: flex-end;
    }

    .tile-panel {
      position: absolute;
      right: 12px; bottom: 74px;
      width: min(320px, calc(100vw - 24px));
      background: rgba(22, 27, 34, 0.96);
      border: 1px solid #2d333b; border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
    }
    .tile-panel.visible { display: block; }
    .tile-panel h3 {
      margin: 0 0 8px 0; font-size: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    .tile-panel .swatch {
      width: 12px; height: 12px; border-radius: 3px;
    }
    .tile-panel .row {
      display: flex; justify-content: space-between;
      font-size: 13px; padding: 2px 0; color: #adbac7;
    }
    .tile-panel .row b { color: #e6e6e6; font-weight: 500; }
    .tile-panel .actions {
      display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;
    }
    .tile-panel .actions .btn { flex: 1; min-width: 80px; }

    .turn-banner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid #2d333b; border-radius: 12px;
      padding: 18px 28px;
      font-size: 20px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .turn-banner.visible { opacity: 1; }

    .debug {
      position: absolute; top: 56px; left: 12px;
      font-size: 12px; color: #8b949e;
      pointer-events: none; white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-overlay">
    <div class="hud-top">
      <button class="btn" id="btn-mode-strategy">Стратегия</button>
      <button class="btn" id="btn-mode-tactical">Тактика</button>
      <button class="btn" id="btn-mode-build">Стройка</button>

      <div class="resources" id="resource-bar"></div>
    </div>

    <div class="debug" id="debug-panel"></div>

    <div class="tile-panel" id="tile-panel"></div>

    <div class="hud-bottom">
      <button class="btn" id="btn-end-turn">Конец хода</button>
    </div>

    <div class="turn-banner" id="turn-banner"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
