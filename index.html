<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ascension Protocol</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d10;
      color: #e6e6e6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #game-canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #ui-overlay > * {
      pointer-events: auto;
    }
    .hud-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
      padding-top: max(10px, env(safe-area-inset-top));
    }
    .btn {
      background: #1c2128;
      color: #e6e6e6;
      border: 1px solid #2d333b;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:active { background: #2d333b; }
    .hud-bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .debug {
      position: absolute;
      top: 56px;
      left: 12px;
      font-size: 12px;
      color: #8b949e;
      pointer-events: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-overlay">
    <div class="hud-top">
      <button class="btn" id="btn-mode-strategy">Стратегия</button>
      <button class="btn" id="btn-mode-tactical">Тактика</button>
      <button class="btn" id="btn-mode-build">Стройка</button>
    </div>

    <div class="debug" id="debug-panel"></div>

    <div class="hud-bottom">
      <button class="btn" id="btn-end-turn">Конец хода</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
